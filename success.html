<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks for kicking it ✦ SACK.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@700&family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
:root { --ink:#0d0d0d; --paper:#f4f1ea; --hot:#ff3b1f; --acid:#d6ff3b; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
}
.wrap { text-align: center; max-width: 600px; }
h1 {
  font-family: 'Bagel Fat One', cursive;
  font-size: clamp(60px, 14vw, 140px);
  line-height: 0.9;
  letter-spacing: -0.04em;
  margin-bottom: 24px;
}
h1 .hot { color: var(--hot); }
h1 .stroke { -webkit-text-stroke: 3px var(--ink); color: transparent; }
p { font-size: 18px; margin-bottom: 32px; max-width: 440px; margin-left: auto; margin-right: auto; }
.cta {
  display: inline-block;
  background: var(--ink);
  color: var(--paper);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 14px;
  padding: 16px 28px;
  border: 2px solid var(--ink);
  text-decoration: none;
  box-shadow: 4px 4px 0 var(--hot);
  transition: transform 0.15s, box-shadow 0.15s;
}
.cta:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--hot); }
.sticker {
  display: inline-block;
  background: var(--acid);
  border: 2px solid var(--ink);
  border-radius: 50%;
  width: 140px;
  height: 140px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  text-transform: uppercase;
  line-height: 1.2;
  letter-spacing: 0.04em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transform: rotate(-8deg);
  margin-bottom: 32px;
  box-shadow: 4px 4px 0 var(--ink);
}
</style>
</head>
<body>
<div class="wrap">
  <div class="sticker">order<br>confirmed ✦</div>
  <h1><span class="hot">nice</span><br><span class="stroke">kick.</span></h1>
  <p>Your sacks are on the way. Check your email for tracking. Tag <strong>@sack</strong> on TikTok when you get them — we repost weekly.</p>
  <a href="/" class="cta">keep shopping →</a>
</div>
<script>
  // Clear cart on successful checkout
  localStorage.removeItem('sack_cart');
</script>
</body>
</html>
